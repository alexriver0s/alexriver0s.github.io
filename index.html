<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Riveros — Soporte Técnico IT</title>
  <style>
    :root {
      --fondo: #0f172a;
      --texto: #e2e8f0;
      --acento: #38bdf8;
      --suave: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .caja { max-width: 560px; }
    .etiqueta {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--acento);
      border: 1px solid var(--acento);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      line-height: 1.15;
      margin-bottom: 16px;
    }
    p { color: var(--suave); line-height: 1.6; font-size: 1.05rem; }
    .pie { margin-top: 40px; font-size: 0.85rem; color: #475569; }
  </style>
</head>
<body>
  <main class="caja">
    <span class="etiqueta">Sitio en construcción</span>
    <h1>Alex Riveros<br>Soporte Técnico IT</h1>
    <p>Estoy preparando este espacio para ofrecer servicios de soporte técnico e infraestructura a empresas. Muy pronto vas a poder agendar una consulta desde acá.</p>
    <p class="pie">Asunción, Paraguay</p>
  </main>
</body>
</html>
